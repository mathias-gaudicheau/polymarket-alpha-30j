name: Collecte

on:
  workflow_dispatch:
  schedule:
    # Forme la plus standard possible : la planification de GitHub n'a pas
    # demarre en 75 minutes avec une expression par plage, on ne prend plus
    # le moindre risque de lecture.
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecter:
    runs-on: ubuntu-latest
    # Chaque execution enchaine plusieurs cycles au lieu d'un seul. GitHub
    # honore les planifications au mieux, avec des retards frequents et
    # parfois des omissions : faire dependre la cadence de son horloge etait
    # un point de fragilite unique. Un declenchement honore couvre desormais
    # un quart d'heure entier, et l'intervalle de cinq minutes est tenu par
    # notre propre chronometre.
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enchainer les cycles
        run: |
          git config user.name  "collecteur"
          git config user.email "collecteur@users.noreply.github.com"

          consigner() {
            git add journal/ 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "   rien a consigner"
              return 0
            fi
            git commit -q -m "journal $(date -u '+%Y-%m-%d %H:%M') UTC"
            for essai in 1 2 3; do
              if git push -q origin HEAD:main 2>/dev/null; then
                echo "   consigne"
                return 0
              fi
              git pull --rebase -q origin main || true
              sleep $((essai * 3))
            done
            echo "::warning::consignation impossible, les donnees suivront au prochain cycle"
            return 0
          }

          debut=$(date +%s)
          for i in 1 2 3; do
            echo "--- cycle $i/3 ---"
            python collecte/cycle.py || echo "::warning::cycle $i en anomalie"
            consigner
            if [ "$i" -lt 3 ]; then
              # On vise un pas de cinq minutes de bord a bord, en retirant le
              # temps deja consomme : le rythme reste regulier meme quand un
              # cycle traine.
              cible=$((debut + i * 300))
              reste=$((cible - $(date +%s)))
              [ "$reste" -gt 0 ] && sleep "$reste"
            fi
          done
