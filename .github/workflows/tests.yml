name: Tests

on:
  push:
    paths:
      - "**.py"
  workflow_dispatch:

jobs:
  tester:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detecteurs et moteur d execution
        run: python tests/test_detecteurs.py

      - name: Moteur de decouverte
        run: python tests/test_fouille.py

      - name: Garde-fous et coupe-circuit
        run: python tests/test_garde_fous.py
